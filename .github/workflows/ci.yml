name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: DEVBOARD_TRAY=0 bash scripts/smoke.sh

  tray:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build tray
        working-directory: tray
        run: |
          swift --version
          if ! swift --version | grep -qE 'Swift version [6-9]\.'; then
            echo "skip: Swift 6 toolchain not on this runner"
            exit 0
          fi
          swift build -c release
