<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devboard</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d0c; --card: #0f1412; --edge: #1b2520; --edge-hi: #2a382f;
    --fg: #e3eae6; --muted: #7b8983; --dim: #4b5852;
    --on: #62d69f; --on-deep: #0b3a26; --warn: #d9a441; --danger: #df5f5b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --pane: 640px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; color: var(--fg); font: 14px/1.45 var(--sans);
    background: var(--bg) radial-gradient(900px 420px at 30% -10%, rgba(98, 214, 159, .10), transparent 70%) no-repeat; }
  a { color: var(--on); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--on); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  header.top { display: flex; align-items: center; gap: 20px; padding: 22px 28px 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--on); box-shadow: 0 0 14px var(--on); }
  h1 { margin: 0; font: 600 15px/1 var(--mono); letter-spacing: .12em; }
  #stamp { color: var(--muted); margin-left: auto; }
  .ghost { padding: 7px 12px; border: 1px solid var(--edge-hi); border-radius: 8px; color: var(--fg); font-size: 13px; }
  .ghost:hover { border-color: var(--on); color: var(--on); }
  .ghost.danger:hover { border-color: var(--danger); color: var(--danger); }

  main { padding: 10px 28px 48px; }
  body.logs-open main, body.logs-open header.top { padding-right: calc(min(var(--pane), 92vw) + 28px); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
  .card .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card .name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .card .ports { display: flex; gap: 10px; margin-top: 3px; }
  .card .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
  .card .facts span:first-child { color: var(--fg); }
  .card.off .facts { color: var(--dim); }
  .card .path, .card .cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .card .cmd { color: var(--dim); }
  .card .actions { display: flex; gap: 4px 14px; flex-wrap: wrap; margin-top: 4px; }
  .card .actions button { color: var(--muted); font-size: 13px; padding: 2px 0; border-bottom: 1px solid transparent; }
  .card .actions button:hover:not(:disabled) { color: var(--fg); border-bottom-color: var(--edge-hi); }
  .card .actions button.danger:hover { color: var(--danger); }
  .card .actions button:disabled { color: var(--dim); cursor: default; }
  .card .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--edge); }
  .card.on .bar { background: linear-gradient(90deg, var(--on) 0%, rgba(98,214,159,.15) 100%); }
  .card.busy .bar { background: var(--warn); }

  .switch { flex: none; position: relative; width: 46px; height: 26px; border-radius: 13px; background: #1c2622; border: 1px solid var(--edge-hi); transition: background .2s, box-shadow .2s; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #9aa8a1; transition: transform .2s, background .2s; }
  .card.on .switch { background: var(--on); border-color: transparent; box-shadow: 0 0 16px rgba(98,214,159,.45), inset 0 0 0 1px rgba(255,255,255,.15); }
  .card.on .switch .knob { transform: translateX(20px); background: var(--on-deep); }
  .card.busy .switch { background: #4a3a14; border-color: var(--warn); cursor: progress; }
  .card.busy .switch .knob { background: var(--warn); animation: knob 1s ease-in-out infinite alternate; }
  @keyframes knob { from { transform: translateX(0); } to { transform: translateX(20px); } }

  .card.add { border-style: dashed; border-color: var(--edge-hi); gap: 10px; }
  .card.add h2 { margin: 0 0 4px; font: 600 14px var(--sans); }
  .field { display: grid; gap: 4px; }
  .field label { color: var(--muted); font-size: 12px; }
  .field input { font: 13px var(--mono); color: var(--fg); background: #0a0f0d; border: 1px solid var(--edge-hi); border-radius: 6px; padding: 7px 9px; }
  .field input:focus { outline: none; border-color: var(--on); }
  .row2 { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  .form-actions { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .form-actions .primary { background: var(--on); color: var(--on-deep); border-radius: 8px; padding: 7px 14px; font-weight: 600; }
  .form-actions .primary:hover { filter: brightness(1.08); }
  .form-error { color: var(--danger); font-size: 13px; min-height: 1.2em; }

  .empty { color: var(--muted); padding: 26px 0; grid-column: 1 / -1; }

  details.sys { margin-top: 28px; }
  details.sys summary { cursor: pointer; color: var(--muted); font-family: var(--mono); font-size: 12px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.sys summary::before { content: "▸"; color: var(--dim); } details.sys[open] summary::before { content: "▾"; }
  .sysrow { display: grid; grid-template-columns: 190px 170px 70px 1fr auto; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--edge); color: var(--muted); }
  .sysrow .n { color: var(--fg); } .sysrow .c { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .sysrow button { color: var(--muted); font-size: 12px; } .sysrow button:hover { color: var(--danger); }

  #logs { position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--pane), 92vw); background: #070a09; border-left: 1px solid var(--edge-hi); display: none; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,.5); }
  #logs.open { display: flex; }
  #logs .grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; }
  #logs .grip:hover, #logs .grip.active { background: linear-gradient(90deg, transparent, rgba(98,214,159,.35), transparent); }
  #logs .bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--edge); }
  #logs .bar strong { font: 600 13px var(--mono); white-space: nowrap; }
  #logs .bar .meta { color: var(--muted); margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-tools { display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--edge); }
  .pane-tools input.filter { flex: 1; font: 12px var(--mono); color: var(--fg); background: #0a0f0d; border: 1px solid var(--edge-hi); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  .pane-tools input.filter:focus { outline: none; border-color: var(--on); }
  .pane-tools label { color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; }
  .pane-tools input[type=checkbox] { accent-color: var(--on); }
  .pane-tools #logCount { color: var(--dim); white-space: nowrap; }
  #logBody { flex: 1; min-height: 0; overflow: auto; }
  #logBody pre { margin: 0; padding: 12px 16px 24px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; color: #c7d1cc; }
  #logBody mark { background: rgba(98,214,159,.25); color: inherit; }
  #logs .note { padding: 22px 16px; color: var(--muted); max-width: 60ch; line-height: 1.55; }
  #logs .note strong { color: var(--fg); }
  #logs .note .ghost { margin-top: 12px; display: inline-block; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 9px 14px; border-radius: 8px; display: none; max-width: 80vw; z-index: 2; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .hiddenrow { display: flex; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--edge); color: var(--muted); }
  .hiddenrow .n { color: var(--fg); } .hiddenrow button { color: var(--muted); font-size: 12px; } .hiddenrow button:hover { color: var(--on); }
  @media (max-width: 640px) { header.top { flex-wrap: wrap; } main { padding: 10px 16px 48px; } .sysrow { grid-template-columns: 1fr auto; } .sysrow .c, .sysrow .p { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span><h1>devboard</h1></div>
  <span class="mono" id="stamp">connecting…</span>
  <button class="ghost" id="startAll" title="Switch on every saved server that is off">Start all</button>
  <button class="ghost danger" id="stopAll" title="Switch off every running dev server">Stop all</button>
  <button class="ghost" id="addBtn">+ Add server</button>
</header>
<main>
  <form class="card add" id="addForm" hidden autocomplete="off">
    <h2 id="formTitle">Add a server</h2>
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" placeholder="core-api" required></div>
    <div class="field"><label for="f-cwd">Folder</label><input id="f-cwd" name="cwd" placeholder="~/Desktop/Sadie/CoreAgentsHub/apps/core-api" required></div>
    <div class="row2">
      <div class="field"><label for="f-cmd">Command</label><input id="f-cmd" name="command" placeholder="bun run --watch src/index.ts" required></div>
      <div class="field"><label for="f-port">Port</label><input id="f-port" name="port" type="number" min="1" max="65535" placeholder="3003" required></div>
    </div>
    <div class="form-error" id="formError"></div>
    <div class="form-actions"><button class="primary" type="submit" id="formSubmit">Add server</button><button class="ghost" type="button" id="addCancel">Cancel</button></div>
  </form>
  <section class="grid" id="dev"></section>
  <details class="sys" id="sys">
    <summary>System processes <span id="sysCount"></span></summary>
    <div id="sysList"></div>
  </details>
  <details class="sys" id="hiddenSec" hidden>
    <summary>Hidden cards <span id="hiddenCount"></span></summary>
    <div id="hiddenList"></div>
  </details>
</main>
<section id="logs">
  <div class="grip" id="grip" title="Drag to resize"></div>
  <div class="bar"><strong id="logTitle"></strong><span class="meta mono" id="logMeta"></span><button class="ghost" id="logClose">Close</button></div>
  <div class="pane-tools mono">
    <input class="filter" id="logFilter" placeholder="Filter lines" autocomplete="off" spellcheck="false">
    <label><input type="checkbox" id="logFollow" checked> Follow</label>
    <span id="logCount"></span>
  </div>
  <div id="logBody"></div>
</section>
<div id="toast" role="status"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const home = (p) => (p ? p.replace(/^\/Users\/[^/]+/, "~") : "");
let latest = [];
const busy = new Map(); // id -> { state: "starting" | "stopping", at }, until the next poll confirms the change or 15 s pass
const setBusy = (id, state) => busy.set(id, { state, at: Date.now() });
let openLog = null;
let editingId = null; // pinned id being edited in the form, or null when adding

function openForm(s) {
  const f = $("#addForm");
  editingId = s ? s.id : null;
  f.reset();
  if (s) { f.elements.name.value = s.name; f.elements.cwd.value = s.cwd ?? ""; f.elements.command.value = s.command ?? ""; f.elements.port.value = s.ports[0]; }
  $("#formTitle").textContent = s ? `Edit ${s.name}` : "Add a server";
  $("#formSubmit").textContent = s ? "Save changes" : "Add server";
  $("#formError").textContent = "";
  f.hidden = false;
  f.scrollIntoView({ block: "nearest" });
  $("#f-name").focus();
}
function closeForm() { $("#addForm").hidden = true; editingId = null; $("#formError").textContent = ""; }

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.style.display = "none"), 4500);
}

function card(s) {
  const running = s.status === "running";
  const b = busy.get(s.id)?.state;
  const state = b ? "busy" : running ? "on" : "off";
  const ports = s.ports.map((p) => `<a class="mono" href="http://localhost:${p}" target="_blank" rel="noopener">:${p}</a>`).join("");
  const facts = running
    ? `<span>pid ${s.rootPid}</span><span>up ${esc(s.uptime)}</span><span>${s.cpu != null ? s.cpu.toFixed(1) : "0.0"}% cpu</span><span>${s.memMb ?? 0} MB</span>`
    : `<span>off</span><span>${s.pinned ? "saved" : ""}</span>`;
  const actions = [
    `<button data-act="logs">Logs</button>`,
    running ? `<button data-act="restart" ${s.cwd ? "" : 'disabled title="working directory unknown"'}>Restart</button>` : "",
    running && !s.pinned ? `<button data-act="pin" ${s.cwd ? "" : 'disabled title="working directory unknown"'}>Pin</button>` : "",
    s.pinned ? `<button data-act="edit">Edit</button>` : "",
    s.pinned ? `<button data-act="remove" class="danger">Remove</button>` : "",
    `<button data-act="hide" title="Move this card to the hidden list">Hide</button>`,
  ].join("");
  const switchLabel = b === "starting" ? "Starting" : b === "stopping" ? "Stopping" : running ? `Turn ${s.name} off` : `Turn ${s.name} on`;
  return `<article class="card ${state}" data-id="${esc(s.id)}" data-name="${esc(s.name)}">
    <div class="head">
      <div><div class="name">${esc(s.name)}${s.pinned ? ' <span class="mono" style="color:var(--dim)">pinned</span>' : ""}</div><div class="ports">${ports}</div></div>
      <button class="switch" role="switch" aria-checked="${running}" aria-label="${esc(switchLabel)}" title="${esc(switchLabel)}" data-act="toggle" ${b ? "disabled" : ""}><span class="knob"></span></button>
    </div>
    <div class="facts mono">${facts}</div>
    <div class="path mono" title="${esc(s.cwd)}">${esc(home(s.cwd))}</div>
    <div class="cmd mono" title="${esc(s.command)}">${esc(s.command ?? "")}</div>
    <div class="actions">${actions}</div>
    <div class="bar"></div>
  </article>`;
}
function sysRow(s) {
  return `<div class="sysrow mono" data-id="${esc(s.id)}" data-name="${esc(s.name)}"><span class="n">${esc(s.name)}</span><span class="p">${s.ports.map((p) => ":" + p).join("  ")}</span><span>${s.rootPid}</span><span class="c" title="${esc(s.command)}">${esc(s.command)}</span><button data-act="kill-sys" data-root="${s.rootPid}">Kill</button></div>`;
}

function hiddenRow(s) {
  return `<div class="hiddenrow mono" data-id="${esc(s.id)}"><span class="n">${esc(s.name)}</span><span>${s.ports.map((p) => ":" + p).join("  ")}</span><span>${s.status}</span><button data-act="unhide">Show</button></div>`;
}

function render() {
  const dev = latest.filter((s) => s.kind === "dev" && !s.hidden);
  const hidden = latest.filter((s) => s.kind === "dev" && s.hidden);
  const sys = latest.filter((s) => s.kind === "system");
  $("#hiddenSec").hidden = hidden.length === 0;
  $("#hiddenList").innerHTML = hidden.map(hiddenRow).join("");
  $("#hiddenCount").textContent = `(${hidden.length})`;
  $("#startAll").disabled = !dev.some((s) => s.status === "stopped");
  $("#stopAll").disabled = !dev.some((s) => s.status === "running");
  for (const [id, { state, at }] of busy) {
    const s = dev.find((x) => x.id === id);
    const settled = (state === "starting" && s?.status === "running") || (state === "stopping" && (!s || s.status === "stopped"));
    if (settled || Date.now() - at > 15000) busy.delete(id);
  }
  dev.sort((a, b) => (a.status === b.status ? a.name.localeCompare(b.name) : a.status === "running" ? -1 : 1));
  $("#dev").innerHTML = dev.length ? dev.map(card).join("") : `<p class="empty">Nothing running. Start a dev server from a terminal and it shows up here, or add one above and switch it on.</p>`;
  $("#sysList").innerHTML = sys.map(sysRow).join("");
  $("#sysCount").textContent = `(${sys.length})`;
  const on = dev.filter((s) => s.status === "running").length;
  $("#stamp").textContent = `${on} on   ${dev.length - on} off   ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
  renderLog();
}

async function refresh() {
  try {
    const { services } = await api("GET", "/api/services");
    latest = services;
    render();
  } catch (e) {
    $("#stamp").textContent = "devboard server unreachable";
  }
}
const refreshSoon = () => [700, 1600, 3000].forEach((ms) => setTimeout(refresh, ms));

let logLines = []; // last fetched lines for the open log; the filter re-renders from this without refetching
function paintLog() {
  const body = $("#logBody");
  const q = $("#logFilter").value.trim().toLowerCase();
  const shown = q ? logLines.filter((l) => l.toLowerCase().includes(q)) : logLines;
  let pre = body.querySelector("pre");
  if (!pre) { body.innerHTML = "<pre></pre>"; pre = body.firstChild; }
  if (q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
    pre.innerHTML = shown.map((l) => esc(l).replace(re, (m) => `<mark>${m}</mark>`)).join("\n");
  } else {
    pre.textContent = shown.join("\n");
  }
  $("#logCount").textContent = q ? `${shown.length} of ${logLines.length} lines` : `${logLines.length} lines`;
  if ($("#logFollow").checked) body.scrollTop = body.scrollHeight;
}

async function renderLog() {
  if (!openLog) return;
  const s = latest.find((x) => x.id === openLog);
  const body = $("#logBody");
  $("#logTitle").textContent = s ? s.name : openLog;
  if (!s) { body.innerHTML = `<div class="note">This service is no longer on the board.</div>`; $("#logMeta").textContent = ""; $("#logCount").textContent = ""; return; }
  if (!s.hasLog) {
    $("#logMeta").textContent = "no output captured";
    $("#logCount").textContent = "";
    body.innerHTML = s.status === "running"
      ? `<div class="note"><strong>${esc(s.name)}</strong> was started from a terminal, so its output is going there. devboard can only show output of services it starts itself.<br><button class="ghost" data-act="restart" data-id="${esc(s.id)}">Restart ${esc(s.name)} here</button> <span style="margin-left:10px">and the log appears within a few seconds.</span></div>`
      : `<div class="note"><strong>${esc(s.name)}</strong> has never been started from devboard. Switch it on and its output lands here.</div>`;
    return;
  }
  try {
    const { lines, size } = await api("GET", `/api/logs/${encodeURIComponent(s.id)}?lines=2000`);
    logLines = lines;
    $("#logMeta").textContent = `${(size / 1024).toFixed(0)} KB   ~/.devboard/logs/${s.id}.log`;
    paintLog();
  } catch (e) { toast(e.message); }
}
function openPane(id) {
  openLog = id; logLines = [];
  $("#logFilter").value = ""; $("#logFollow").checked = true;
  $("#logBody").innerHTML = "";
  $("#logs").classList.add("open"); document.body.classList.add("logs-open");
  renderLog();
}
function closePane() { openLog = null; $("#logs").classList.remove("open"); document.body.classList.remove("logs-open"); }
$("#logFilter").oninput = paintLog;
$("#logFollow").onchange = () => { if ($("#logFollow").checked) $("#logBody").scrollTop = $("#logBody").scrollHeight; };
$("#logBody").addEventListener("scroll", () => {
  const b = $("#logBody");
  const atBottom = b.scrollTop + b.clientHeight >= b.scrollHeight - 8;
  if (!atBottom && $("#logFollow").checked) $("#logFollow").checked = false; // scrolling up pauses follow
  else if (atBottom && !$("#logFollow").checked) $("#logFollow").checked = true;
});

// Drag the pane's left edge to resize; the width is remembered per browser.
try { const w = Number(localStorage.getItem("devboard.pane")); if (w >= 360) document.documentElement.style.setProperty("--pane", w + "px"); } catch {}
$("#grip").addEventListener("pointerdown", (ev) => {
  const grip = ev.currentTarget; grip.setPointerCapture(ev.pointerId); grip.classList.add("active");
  const move = (e) => document.documentElement.style.setProperty("--pane", Math.max(360, Math.min(window.innerWidth * 0.92, window.innerWidth - e.clientX)) + "px");
  const up = () => { grip.classList.remove("active"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); try { localStorage.setItem("devboard.pane", parseInt(getComputedStyle(document.documentElement).getPropertyValue("--pane"))); } catch {} };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (openLog) closePane(); else if (!$("#addForm").hidden) closeForm();
});

async function switchAll(on) {
  const dev = latest.filter((s) => s.kind === "dev" && !s.hidden);
  const targets = dev.filter((s) => (on ? s.status === "stopped" : s.status === "running"));
  if (!targets.length) return;
  if (!on && !confirm(`Switch off ${targets.length} running dev server${targets.length > 1 ? "s" : ""}? Unsaved ones get pinned first so you can switch them back on.`)) return;
  for (const s of targets) setBusy(s.id, on ? "starting" : "stopping");
  render();
  for (const s of targets) {
    try {
      if (on) await api("POST", "/api/start", { id: s.id });
      else { if (!s.pinned) await api("POST", "/api/pin", { rootPid: s.rootPid }); await api("POST", "/api/kill", { rootPid: s.rootPid }); }
    } catch (e) { busy.delete(s.id); toast(`${s.name}: ${e.message}`); }
  }
  refresh(); refreshSoon();
}
$("#startAll").onclick = () => switchAll(true);
$("#stopAll").onclick = () => switchAll(false);

document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const holder = btn.closest("[data-id]");
  const id = btn.dataset.id || holder?.dataset.id;
  const s = latest.find((x) => x.id === id);
  btn.disabled = true;
  try {
    if (act === "toggle" && s) {
      if (s.status === "running") {
        setBusy(id, "stopping");
        if (!s.pinned) await api("POST", "/api/pin", { rootPid: s.rootPid }); // keep the card so it can be switched back on
        await api("POST", "/api/kill", { rootPid: s.rootPid });
      } else {
        setBusy(id, "starting");
        await api("POST", "/api/start", { id });
      }
    } else if (act === "restart" && s) {
      setBusy(id, "starting");
      await api("POST", "/api/restart", s.rootPid ? { rootPid: s.rootPid } : { id });
    } else if (act === "pin" && s) {
      await api("POST", "/api/pin", { rootPid: s.rootPid });
    } else if (act === "edit" && s) {
      openForm(s);
    } else if (act === "remove" && s) {
      await api("DELETE", `/api/pin/${encodeURIComponent(id)}`);
    } else if (act === "logs" && s) {
      openPane(id);
    } else if (act === "hide" && s) {
      await api("POST", "/api/ignore", { id });
      if (openLog === id) closePane();
    } else if (act === "unhide" && s) {
      await api("DELETE", `/api/ignore/${encodeURIComponent(id)}`);
    } else if (act === "kill-sys") {
      const name = holder?.dataset.name || "this process";
      if (confirm(`Kill ${name}? It is a system process and macOS may restart it.`)) await api("POST", "/api/kill", { rootPid: Number(btn.dataset.root) });
    }
  } catch (e) {
    busy.delete(id);
    toast(e.message);
  } finally {
    render();
    refresh();
    if (act === "toggle" || act === "restart") refreshSoon();
  }
});

$("#logClose").onclick = closePane;
$("#addBtn").onclick = () => ($("#addForm").hidden ? openForm(null) : closeForm());
$("#addCancel").onclick = closeForm;
$("#addForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const data = Object.fromEntries(new FormData(f));
  const body = { name: data.name, cwd: data.cwd, command: data.command, port: Number(data.port) };
  try {
    if (editingId) await api("PUT", `/api/pinned/${encodeURIComponent(editingId)}`, body);
    else await api("POST", "/api/pinned", body);
    closeForm();
    refresh();
  } catch (e) { $("#formError").textContent = e.message; }
};

refresh();
setInterval(refresh, 3000);
setInterval(renderLog, 2000);
</script>
</body>
</html>
